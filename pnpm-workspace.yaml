# 单包工程配置（2026-10-18 独立仓后建立）
#
# pnpm 12 把 allowBuilds / minimumReleaseAgeExclude / trustLockfile 这类设置只从
# pnpm-workspace.yaml 读取（本文件由 `pnpm install` 首次生成，这里补全）。
# 本仓没有子包；不加 `packages` 即把根包当唯一工程。

# 构建脚本审批：vite 依赖 esbuild postinstall（控制台前端构建）。
allowBuilds:
    esbuild: true

# 同步升级的 Napuketto 发布组
minimumReleaseAgeExclude:
    - "@napuketto/adapter"
    - "@napuketto/kernel"
    - "@napuketto/loader"
    - "@napuketto/media"
    - "@napuketto/network"

# 本仓 lockfile 自产自销，视为可信基础（同主仓理由）。
trustLockfile: true
