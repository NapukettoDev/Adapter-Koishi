name: Sync Napuketto dependencies

on:
    schedule:
        - cron: "41 1 * * *"
    workflow_dispatch:
    repository_dispatch:
        types: [napuketto-published]

concurrency:
    group: sync-napuketto-deps
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    resolve:
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        outputs:
            changed: ${{ steps.resolve.outputs.changed }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - id: resolve
              name: 解析整组 npm latest
              run: |
                  node tooling/sync-napuketto-deps.ts --update
                  if git diff --quiet -- package.json pnpm-lock.yaml; then
                      echo 'changed=false' >> "$GITHUB_OUTPUT"
                  else
                      echo 'changed=true' >> "$GITHUB_OUTPUT"
                  fi

            - if: steps.resolve.outputs.changed == 'true'
              uses: actions/upload-artifact@v7
              with:
                  name: napuketto-dependencies
                  path: |
                      package.json
                      pnpm-lock.yaml
                  if-no-files-found: error
                  retention-days: 3

    open-pr:
        needs: resolve
        if: needs.resolve.outputs.changed == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: 确认默认分支仍对应本次解析
              env:
                  BASE_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  current=$(git ls-remote origin "refs/heads/$BASE_BRANCH" | cut -f1)
                  if [ "$current" != "$GITHUB_SHA" ]; then
                      echo '::error::默认分支已更新，请重新运行以解析最新的锁文件。'
                      exit 1
                  fi

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: napuketto-dependencies
                  path: ${{ runner.temp }}/napuketto-dependencies

            - name: 应用 manifest 与 lockfile
              run: |
                  cp "$RUNNER_TEMP/napuketto-dependencies/package.json" package.json
                  cp "$RUNNER_TEMP/napuketto-dependencies/pnpm-lock.yaml" pnpm-lock.yaml

            - name: 检查依赖更新 App 配置
              env:
                  APP_ID: ${{ vars.DEPS_APP_CLIENT_ID }}
                  APP_KEY: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
              run: |
                  if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
                      echo '::error::请按 docs/operations/release.md 配置 DEPS_APP_CLIENT_ID 和 DEPS_APP_PRIVATE_KEY。'
                      exit 1
                  fi

            - id: app-token
              uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
              with:
                  client-id: ${{ vars.DEPS_APP_CLIENT_ID }}
                  private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: 创建或更新依赖 PR
              uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  base: ${{ github.event.repository.default_branch }}
                  branch: automation/napuketto-deps
                  add-paths: |
                      package.json
                      pnpm-lock.yaml
                  commit-message: "build(deps): 同步 Napuketto 发布组"
                  title: "build(deps): 同步 Napuketto 发布组"
                  body: |
                      将 adapter、kernel、loader、media 和 network 一起对齐 npm latest。
                      更新任务已核对五包的直接及组内传递版本。请审查 CI 中的构建、peer、IPC 和平台测试。
                  labels: dependencies
                  sign-commits: true
                  delete-branch: true
