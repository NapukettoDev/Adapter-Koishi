version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
          timezone: Asia/Shanghai
      open-pull-requests-limit: 5
      cooldown:
          default-days: 1
      labels:
          - ci
          - dependencies
      ignore:
          # 这组由 sync-napuketto-deps.yml 整体更新。
          - dependency-name: "@napuketto/*"
      groups:
          koishi-host:
              patterns:
                  - koishi
                  - "@koishijs/plugin-console"
          frontend:
              patterns:
                  - vue
                  - vite
                  - "@vitejs/plugin-vue"
                  - vitest
          runtime:
              dependency-type: production
              update-types: [minor, patch]
          development:
              dependency-type: development
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
          timezone: Asia/Shanghai
      labels:
          - ci
          - dependencies
      groups:
          github-actions:
              patterns:
                  - "*"
