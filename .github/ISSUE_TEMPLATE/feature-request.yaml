name: 功能请求
description: 提议新能力或改进（事件/动作映射、媒体管线、控制台、配置、文档）
title: "Feature: "
labels:
    - feature
body:
    - type: markdown
      attributes:
          value: |
              范围先说清（见根 [AGENTS.md](https://github.com/NapukettoDev/Adapter-Koishi/blob/main/AGENTS.md)
              的「范围禁区」）：**Satori 动作面、`session.onebot.*` 驼峰兼容糖、把群通知/请求事件
              硬翻成 koishi `notice` / `request`、HTTP/WebSocket 服务**都不在路线内，相关请求会被
              关闭并说明原因。
              新能力优先落在适配层：`src/events/`、`src/actions/`、`src/driver/`、`src/console/`、
              `client/`。需要子进程动作表本身新增能力时，由上游 `@napuketto/*` 提供，本仓不硬造。

    - type: dropdown
      id: kind
      attributes:
          label: 请求类型
          description: 选最接近的一类；跨类请在正文里分别说明。
          options:
              - 收方向（消息事件 / 元素映射 / OB11 原始事件）
              - 发方向（动作 / 元素 / 媒体管线）
              - 控制台登录面板与交互
              - 配置项与运维体验（schema、默认值、日志等级）
              - 文档与工具链（docs / tooling / CI）
              - 其他
      validations:
          required: true

    - type: textarea
      id: problem
      attributes:
          label: 要解决的问题
          description: 先讲问题再讲方案。说明现在卡在哪、绕过去的代价是什么。
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: 期望的解决方案
          description: |
              希望新增什么、如何交互、配置写在哪（`bots` 配置的哪个字段，见
              `docs/guides/configuration.md`）。涉及元素 / 动作时给出 OneBot 11 或 Koishi 侧的
              对应形态。
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: 考虑过的替代方案
          description: 其他实现方式、现成轮子或手工变通，以及为什么不够用。

    - type: textarea
      id: extra
      attributes:
          label: 补充信息
          description: 其他上下文、截图、参考实现链接。注意不要贴 token、uin、密码等敏感信息。
